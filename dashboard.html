    var total = surcharge + gst + cogsAmt + cash + tax + trading;
    var diff = Math.abs(total - sales);
    balSpan.textContent = diff < 0.01 ? 'Balances to the cent' : ('Off by ' + fmtMoney(diff, true));
    balSpan.className = 'cs-balance' + (diff < 0.01 ? '' : ' off');
  }
  ledgerCard.appendChild(rows);
  root.appendChild(ledgerCard);

  root.appendChild(el('p', 'set-note', 'Surcharge and tax rates are set in Settings. Everything left in Trading still splits by hand into Owner’s Pay, Annual Leave, Annual Bills or the Drip account, same as before.'));
}

/* ============================================================
   P&L tab (banksia-dashboard-spec.md #3.2). /api/pl supplies raw actual and
   budget figures only - every derived figure (status colour, catch-up gaps,
   transaction/spend targets) is computed here, same rule the rest of this
   file follows (see the header comment at the top of dashboard.html).
============================================================ */
function fmtInt(v) {
  if (v == null) return '—';
  return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/* Resolves the P&L tab's three period choices to a concrete date range,
   using the same tz-aware tradingToday()/date-stamp helpers resolvePeriod
   already relies on. elapsedFraction only differs from 1 for 'thisMonth'
   (the only period that's ever still in progress) - it drives the catch-up
   panel's "prorated to today" maths. */
function resolvePLPeriod(key) {
  var today = tradingToday();
  var from, to, label;
  if (key === 'lastMonth') {
    var base = addMonths(stamp(today.getUTCFullYear(), today.getUTCMonth() + 1, 1), -1);
    from = stamp(base.getUTCFullYear(), base.getUTCMonth() + 1, 1);
    to = addDays(addMonths(from, 1), -1);
    label = 'Last month';
  } else if (key === 'ytd') {
    from = stamp(today.getUTCFullYear(), 1, 1);
    to = addDays(stamp(today.getUTCFullYear(), today.getUTCMonth() + 1, 1), -1); /* end of the month before this one */
    label = 'All completed months this year';
  } else {
    from = stamp(today.getUTCFullYear(), today.getUTCMonth() + 1, 1);
    to = today;
    label = 'This month';
  }
  var empty = to.getTime() < from.getTime(); /* e.g. "ytd" in January - no completed month yet */
  var elapsedFraction = 1;
  if (key === 'thisMonth' && !empty) {
    var daysInMonth = new Date(Date.UTC(from.getUTCFullYear(), from.getUTCMonth() + 1, 0)).getUTCDate();
    var elapsedDays = Math.round((to.getTime() - from.getTime()) / 86400000) + 1;
    elapsedFraction = Math.min(1, elapsedDays / daysInMonth);
  }
  return { from: from, to: to, label: label, key: key, elapsedFraction: elapsedFraction, empty: empty };
}

/* Manual trigger only - the spec's "nothing pulls live except on demand"
   rule applies here same as everywhere else, so unlike the generic
   Dashboard/Cash Split tabs this one does NOT auto-fetch on open. */
function fetchPL() {
  var pl = state.pl;
  if (pl.loading) return;
  if (isManual()) { pl.data = { available: false, reason: 'manual_mode' }; render(); return; }
  var r = resolvePLPeriod(pl.period);
  if (r.empty) { pl.data = { available: false, reason: 'no_completed_period' }; render(); return; }
  pl.loading = true; pl.error = null;
  render();
  fetch('/api/pl?from=' + iso(r.from) + '&to=' + iso(r.to)).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (json) {
    pl.data = json; pl.loading = false; render();
  }).catch(function () {
    pl.loading = false; pl.error = 'Could not reach the dashboard just now. Try again.'; render();
  });
}

/* Exact per-line KPI/budget tolerance rules are deferred per the spec
   (different rule per line, TBD) - one owner-editable tolerance % stands in
   for all of them (SETTINGS.plTolerancePct). goodDir 'up' = higher than
   budget is better (Revenue, Transactions, true net profit); 'down' = lower
   is better (COGS, Wages, Opex). Double the tolerance lands on red. */
function plTolerance() { return (typeof SETTINGS.plTolerancePct === 'number' && SETTINGS.plTolerancePct >= 0) ? SETTINGS.plTolerancePct : 5; }
function plStatus(actual, budget, goodDir) {
  if (actual == null || budget == null || !budget) return null;
  var diffPct = ((actual - budget) / Math.abs(budget)) * 100;
  var favourable = (goodDir === 'down') ? -diffPct : diffPct;
  var tol = plTolerance();
  if (favourable >= -tol) return 'good';
  if (favourable >= -tol * 2) return 'amber';
  return 'bad';
}
function plStatusLabel(status) {
  return status === 'good' ? 'On track' : (status === 'amber' ? 'Slipping' : 'Over budget');
}
/* "Prorated to today": how far actual is from PACE right now (budget times
   how much of the period has elapsed), not full-period target vs partial
   actual - see spec 3.2's catch-up panel bullet. Only ever shown mid-period
   (This month); zero/negative gaps (on pace or ahead) aren't surfaced. */
function plCatchUpGap(actual, budget, elapsedFraction, goodDir) {
  if (actual == null || budget == null || elapsedFraction == null || elapsedFraction >= 1) return null;
  var expectedToDate = budget * elapsedFraction;
  var gap = (goodDir === 'down') ? (actual - expectedToDate) : (expectedToDate - actual);
  return gap > 0 ? gap : 0;
}

/* One waterfall card: actual (+ budget/status if a budget figure is
   available), with an optional collapsible "dropdown" breakdown - COGS/
   Wages split into their sub-buckets, Opex into its line items, per the
   spec's waterfall layout. */
function plCard(container, opts) {
  var card = el('div', 'pl-card' + (opts.total ? ' pl-total' : ''));
  var head = el('div', 'pl-card-head');
  head.appendChild(el('div', 'pl-card-label', esc(opts.label)));
  var status = (opts.budget != null) ? plStatus(opts.actual, opts.budget, opts.goodDir || 'up') : null;
  if (status) head.appendChild(el('span', 'pl-badge pl-badge-' + status, plStatusLabel(status)));
  card.appendChild(head);

  var figs = el('div', 'pl-figs');
  var fmtFn = opts.fmt === 'int' ? fmtInt : function (v) { return v == null ? '—' : fmtMoney(v); };
  figs.appendChild(el('div', 'pl-actual', esc(fmtFn(opts.actual))));
  if (opts.budget != null) figs.appendChild(el('div', 'pl-budget', 'Budget ' + esc(fmtFn(opts.budget))));
  card.appendChild(figs);

  if (opts.breakdown && opts.breakdown.length) {
    var show = opts.openField ? state.pl[opts.openField] : true;
    if (opts.openField) {
      var toggle = el('button', 'pl-toggle', show ? 'Hide line items' : ('Show ' + opts.breakdown.length + ' line items'));
      toggle.onclick = function () { state.pl[opts.openField] = !show; render(); };
      card.appendChild(toggle);
    }
    if (show) {
      var bd = el('div', 'pl-breakdown');
      opts.breakdown.forEach(function (b) {
        var row = el('div', 'pl-breakdown-row' + (b.uncategorised ? ' pl-uncategorised' : ''));
        row.appendChild(el('span', 'pl-b-label', esc(b.label)));
        row.appendChild(el('span', 'pl-b-value', esc(fmtMoney(b.value))));
        bd.appendChild(row);
      });
      card.appendChild(bd);
    }
  }
  container.appendChild(card);
}

function renderPL(root) {
  root.appendChild(el('div', 'screen-title', 'P&L'));
  root.appendChild(el('p', 'screen-sub', 'Revenue through to true net profit, the same order as your P&amp;L, checked against budget line by line.'));

  var pl = state.pl;
  var r = resolvePLPeriod(pl.period);

  var pbar = el('div', 'period-bar');
  pbar.appendChild(el('span', 'period-label', 'Period'));
  [ { key: 'thisMonth', label: 'This month' }, { key: 'lastMonth', label: 'Last month' }, { key: 'ytd', label: 'All completed months this year' } ].forEach(function (p) {
    var chip = el('button', 'pchip' + (pl.period === p.key ? ' on' : ''), p.label);
    chip.onclick = function () { pl.period = p.key; pl.data = null; pl.error = null; render(); };
    pbar.appendChild(chip);
  });
  root.appendChild(pbar);
  if (!r.empty) root.appendChild(el('div', 'set-note', fmtRange(r)));

  if (r.empty) {
    root.appendChild(el('div', 'pl-empty', 'No completed month yet this year — check back once January has finished.'));
    return;
  }

  if (isManual()) {
    root.appendChild(el('div', 'banner banner-amber', 'You’re in ‘I type them in’ mode, so there’s no Xero connection to pull the P&amp;L from.'));
    return;
  }

  var runBtn = el('button', 'btn-primary-dash', pl.loading ? 'Fetching…' : 'Run the Numbers');
  runBtn.style.margin = '0.2rem 0 1.1rem';
  runBtn.disabled = pl.loading;
  runBtn.onclick = function () { fetchPL(); };
  root.appendChild(runBtn);

  if (pl.error) root.appendChild(el('div', 'banner banner-coral', esc(pl.error)));

  var d = pl.data;
  if (!d) {
    root.appendChild(el('div', 'pl-empty', 'Click Run the Numbers to pull ' + esc(P.accounting) + ' and ' + esc(P.pos) + ' for this period.'));
    return;
  }
  if (d.available === false) {
    var msg = d.reason === 'not_connected' ? ('Connect ' + esc(P.accounting) + ' on the Connections screen first.') : 'Not available right now.';
    root.appendChild(el('div', 'banner banner-amber', msg));
    return;
  }

  Object.keys(d.errors || {}).forEach(function (k) {
    if (d.errors[k]) root.appendChild(el('div', 'banner banner-coral', esc(d.errors[k])));
  });
  if (d.budget && !d.budget.available) {
    root.appendChild(el('div', 'banner banner-amber', 'Budget figures didn’t line up against your chart of accounts this time — showing actuals only. Tell your AI so it can check the account matching.'));
  }

  var cards = el('div', 'pl-cards');
  var hasBudget = d.budget && d.budget.available;

  plCard(cards, { label: 'Revenue', actual: d.revenue.actual, fmt: 'money', goodDir: 'up', budget: hasBudget ? d.budget.revenue : null });

  var periodDays = Math.round((r.to.getTime() - r.from.getTime()) / 86400000) + 1;
  var txTarget = SETTINGS.transactionsTargetWeekly ? (SETTINGS.transactionsTargetWeekly / 7) * periodDays : null;
  plCard(cards, { label: 'Transactions', actual: d.transactions.actual, fmt: 'int', goodDir: 'up', budget: txTarget });

  if (d.cogs) {
    var cogsBreakdown = [
      { label: 'BOH (food)', value: d.cogs.boh },
      { label: 'FOH (beverage)', value: d.cogs.foh },
      { label: 'Retail', value: d.cogs.retail }
    ];
    if (d.cogs.uncategorised) cogsBreakdown.push({ label: 'Uncategorised — needs checking', value: d.cogs.uncategorised, uncategorised: true });
    plCard(cards, { label: 'COGS', actual: d.cogs.total, fmt: 'money', goodDir: 'down', budget: hasBudget ? d.budget.cogs : null, breakdown: cogsBreakdown, openField: 'openCogs' });
  }

  if (d.wages) {
    var wageBreakdown = [];
    if (d.wages.splitAvailable) {
      wageBreakdown.push({ label: 'Kitchen/BOH', value: d.wages.kitchenBoh });
      wageBreakdown.push({ label: 'FOH', value: d.wages.foh });
      wageBreakdown.push({ label: 'Owner', value: d.wages.owner });
      Object.keys(d.wages.other || {}).forEach(function (name) {
        wageBreakdown.push({ label: name, value: d.wages.other[name], uncategorised: true });
      });
    } else {
      wageBreakdown.push({ label: 'Unassigned — “4 Labour” split unavailable this time', value: d.wages.unassigned, uncategorised: true });
    }
    plCard(cards, { label: 'Wages', actual: d.wages.total, fmt: 'money', goodDir: 'down', budget: hasBudget ? d.budget.wages : null, breakdown: wageBreakdown, openField: 'openWages' });
  }

  if (d.opex) {
    var opexBreakdown = d.opex.lines.slice().sort(function (a, b) { return b.value - a.value; }).map(function (l) { return { label: l.label, value: l.value }; });
    plCard(cards, { label: 'Opex total', actual: d.opex.total, fmt: 'money', goodDir: 'down', budget: hasBudget ? d.budget.opex : null, breakdown: opexBreakdown, openField: 'openOpex' });
  }

  /* Owner wages: interim source is Xero's own "Owner Wages and Salaries" +
     "Distribution of Profit" accounts, until the Owner Input tab (built
     later) supplies the owner-entered hours/pay figure instead - see
     spec 3.1. No budget comparison for this line. */
  if (d.ownerWages) plCard(cards, { label: 'Owner wages', actual: d.ownerWages.actual, fmt: 'money' });

  if (d.netProfit) {
    plCard(cards, { label: 'True net profit', actual: d.netProfit.actual, fmt: 'money', goodDir: 'up', total: true, budget: hasBudget ? d.budget.netProfit : null });
  }

  root.appendChild(cards);

  /* Catch-up panel - only meaningful mid-period. */
  if (r.elapsedFraction < 1 && hasBudget) {
    var lines = [];
    var revGap = plCatchUpGap(d.revenue.actual, d.budget.revenue, r.elapsedFraction, 'up');
    if (revGap) {
      lines.push('$' + fmtInt(revGap) + ' more revenue needed to get back on pace this month.');
      if (SETTINGS.avgSpendTarget) lines.push(fmtInt(Math.ceil(revGap / SETTINGS.avgSpendTarget)) + ' extra transactions needed this month to get back on pace, at your average spend target.');
    }
    if (d.cogs) {
      var cogsGap = plCatchUpGap(d.cogs.total, d.budget.cogs, r.elapsedFraction, 'down');
      if (cogsGap && d.revenue.actual) lines.push('Drop COGS by about ' + ((cogsGap / d.revenue.actual) * 100).toFixed(1) + '% of revenue to get back on pace.');
    }
    if (d.wages) {
      var wageGap = plCatchUpGap(d.wages.total, d.budget.wages, r.elapsedFraction, 'down');
      if (wageGap && d.revenue.actual) lines.push('Drop wages by about ' + ((wageGap / d.revenue.actual) * 100).toFixed(1) + '% of revenue to get back on pace.');
    }
    var cu = el('div', 'pl-catchup-card');
    cu.appendChild(el('div', 'pl-catchup-title', 'Catch-up — prorated to today (' + Math.round(r.elapsedFraction * 100) + '% of the month elapsed)'));
    if (lines.length) lines.forEach(function (t) { cu.appendChild(el('div', 'pl-catchup-row', esc(t))); });
    else cu.appendChild(el('div', 'pl-catchup-row', 'On pace or ahead across the board — nothing to catch up on.'));
    root.appendChild(cu);
  }
}

/* ============================================================
   Owner Input tab (banksia-dashboard-spec.md #3.1). Unlike Settings/Manual
   Entry (both localStorage, per-device), entries here have to be visible
   across every owner's own device - the wage split needs everyone's hours
   for the week together - so this reads/writes worker.js's new KV-backed
   /api/ownerinput* endpoints instead of localStorage. Only the "which name
   did I last pick on THIS device" bit is local, as a convenience.
============================================================ */
function ownerInputWeekMonday(key) {
  var ws = startOfWeek(tradingToday());
  if (key === 'lastWeek') ws = addDays(ws, -7);
  return ws;
}
function saveMyOwner(name) {
  state.ownerInput.myOwner = name;
  try { localStorage.setItem('vd_myowner', JSON.stringify(name)); } catch (e) {}
}

function fetchOwnerInput() {
  var oi = state.ownerInput;
  if (oi.loading) return;
  oi.loading = true; oi.error = null;
  render();
  var mon = iso(ownerInputWeekMonday(oi.week));
  fetch('/api/ownerinput?week=' + mon).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (json) {
    oi.data = json; oi.loading = false; render();
  }).catch(function () {
    oi.loading = false; oi.error = 'Could not reach the dashboard just now. Try refresh.'; render();
  });
}

function fetchOwnerWages() {
  var oi = state.ownerInput;
  if (oi.wagesLoading) return;
  if (isManual()) { oi.wages = { available: false, reason: 'manual_mode' }; render(); return; }
  oi.wagesLoading = true;
  render();
  var mon = ownerInputWeekMonday(oi.week);
  fetch('/api/ownerwages?from=' + iso(mon) + '&to=' + iso(addDays(mon, 6))).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (json) {
    oi.wages = json; oi.wagesLoading = false; render();
  }).catch(function () {
    oi.wagesLoading = false; oi.wages = { available: false, error: 'Could not reach the dashboard just now.' }; render();
  });
}

function renderOwnerInput(root) {
  root.appendChild(el('div', 'screen-title', 'Owner input'));
  root.appendChild(el('p', 'screen-sub', 'Days off, workouts, and hours worked - yours and the team’s. Personal stats here are just for owners, never shown to staff.'));

  var oi = state.ownerInput;
  if (!oi.data && !oi.loading) fetchOwnerInput();

  var pbar = el('div', 'period-bar');
  pbar.appendChild(el('span', 'period-label', 'Week'));
  [ { key: 'thisWeek', label: 'This week' }, { key: 'lastWeek', label: 'Last week' } ].forEach(function (p) {
    var chip = el('button', 'pchip' + (oi.week === p.key ? ' on' : ''), p.label);
    chip.onclick = function () { oi.week = p.key; oi.data = null; oi.wages = null; render(); };
    pbar.appendChild(chip);
  });
  root.appendChild(pbar);
  var mon = ownerInputWeekMonday(oi.week);
  root.appendChild(el('div', 'set-note', fmtRange({ from: mon, to: addDays(mon, 6) })));

  if (oi.error) root.appendChild(el('div', 'banner banner-coral', esc(oi.error)));
  if (oi.loading || !oi.data) {
    root.appendChild(el('div', 'pl-empty', 'Loading…'));
    return;
  }

  var data = oi.data;
  var entries = data.entries || [];
  var entryFor = function (name) { return entries.filter(function (e) { return e.ownerName === name; })[0] || null; };

  /* Name picker */
  var ownerWrap = el('div', 'oi-owners');
  (data.owners || []).forEach(function (name) {
    var chip = el('button', 'oi-owner-chip' + (oi.myOwner === name ? ' on' : ''), esc(name));
    chip.onclick = function () { saveMyOwner(name); render(); };
    ownerWrap.appendChild(chip);
  });
  root.appendChild(ownerWrap);

  var addWrap = el('div', 'oi-add-owner');
  var addInp = document.createElement('input'); addInp.type = 'text'; addInp.placeholder = 'Add an owner…'; addInp.maxLength = 60;
  var addBtn = el('button', 'btn-plain', '+ Add owner');
  addBtn.onclick = function () {
    var name = addInp.value.trim();
    if (!name) return;
    addBtn.disabled = true;
    fetch('/api/ownerinput/owner', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name }) })
      .then(function () { saveMyOwner(name); oi.data = null; fetchOwnerInput(); })
      .catch(function () { addBtn.disabled = false; });
  };
  addWrap.appendChild(addInp); addWrap.appendChild(addBtn);
  root.appendChild(addWrap);

  /* Selected owner's entry form */
  if (oi.myOwner) {
    var existing = entryFor(oi.myOwner);
    var card = el('div', 'oi-card');
    card.appendChild(el('div', 'oi-card-title', esc(oi.myOwner) + '’s week'));
    var grid = el('div', 'set-grid');
    var fields = [
      { key: 'daysOff', label: 'Days off' },
      { key: 'workouts', label: 'Workouts' },
      { key: 'ownerHours', label: 'Hours worked' }
    ];
    var inputs = {};
    fields.forEach(function (f) {
      var cell = el('div', 'set-cell');
      cell.appendChild(el('div', 'set-label', f.label));
      var inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any'; inp.min = '0';
      if (existing && typeof existing[f.key] === 'number') inp.value = existing[f.key];
      inputs[f.key] = inp;
      cell.appendChild(inp);
      grid.appendChild(cell);
    });
    card.appendChild(grid);
    var saveNote = el('div', 'set-note', existing ? ('Last saved ' + new Date(existing.updatedAt).toLocaleString() + '. Editable any time.') : 'Not saved yet for this week.');
    card.appendChild(saveNote);
    var saveBtn = el('button', 'btn-primary-dash', 'Save my week');
    saveBtn.style.marginTop = '10px';
    saveBtn.onclick = function () {
      saveBtn.disabled = true;
      fetch('/api/ownerinput/entry', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          week: iso(mon), ownerName: oi.myOwner,
          daysOff: parseFloat(inputs.daysOff.value) || 0,
          workouts: parseFloat(inputs.workouts.value) || 0,
          ownerHours: parseFloat(inputs.ownerHours.value) || 0
        })
      }).then(function () { oi.data = null; fetchOwnerInput(); }).catch(function () { saveBtn.disabled = false; });
    };
    card.appendChild(saveBtn);
    root.appendChild(card);
  } else {
    root.appendChild(el('div', 'set-note', 'Pick your name above (or add it) to log your week.'));
  }

  /* Shared staff hours - not tied to whichever owner is picked */
  var staffCard = el('div', 'oi-card');
  staffCard.appendChild(el('div', 'oi-card-title', 'Staff hours worked'));
  staffCard.appendChild(el('div', 'set-note', 'Totals only, not per staff member. Shared for the week - whoever enters it last is what shows.'));
  var staffInp = document.createElement('input'); staffInp.type = 'number'; staffInp.step = 'any'; staffInp.min = '0'; staffInp.style.marginTop = '10px';
  if (data.staffHours && typeof data.staffHours.staffHours === 'number') staffInp.value = data.staffHours.staffHours;
  staffCard.appendChild(staffInp);
  var staffBtn = el('button', 'btn-plain', 'Save staff hours');
  staffBtn.style.marginLeft = '8px';
  staffBtn.onclick = function () {
    staffBtn.disabled = true;
    fetch('/api/ownerinput/staffhours', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ week: iso(mon), staffHours: parseFloat(staffInp.value) || 0 })
    }).then(function () { oi.data = null; fetchOwnerInput(); }).catch(function () { staffBtn.disabled = false; });
  };
  staffCard.appendChild(staffBtn);
  root.appendChild(staffCard);

  /* Run the Numbers - derives an hourly wage rate from this week's total
     owner hours (logged above) and what Xero shows was actually drawn
     (same figure the P&L tab's "Owner wages" line uses), then splits that
     dollar figure across owners by their share of the total hours. */
  var runBtn = el('button', 'btn-primary-dash', oi.wagesLoading ? 'Fetching…' : 'Run the Numbers');
  runBtn.style.margin = '0.2rem 0 1.1rem';
  runBtn.disabled = oi.wagesLoading;
  runBtn.onclick = function () { fetchOwnerWages(); };
  root.appendChild(runBtn);

  if (oi.wages) {
    if (oi.wages.available === false) {
      var msg = oi.wages.reason === 'manual_mode' ? 'You’re in ‘I type them in’ mode, so there’s no Xero connection to pull pay drawn from.'
        : (oi.wages.reason === 'not_connected' ? ('Connect ' + esc(P.accounting) + ' on the Connections screen first.') : (oi.wages.error || 'Not available right now.'));
      root.appendChild(el('div', 'banner banner-amber', msg));
    } else {
      var totalHours = entries.reduce(function (sum, e) { return sum + (e.ownerHours || 0); }, 0);
      var wageCard = el('div', 'oi-wage-card');
      wageCard.appendChild(el('div', 'oi-card-title', 'Owner hourly wage'));
      if (totalHours > 0) {
        var rate = oi.wages.actual / totalHours;
        wageCard.appendChild(el('div', 'oi-wage-rate', esc(fmtMoney(rate)) + '/hr'));
        wageCard.appendChild(el('div', 'oi-wage-sub', esc(fmtMoney(oi.wages.actual)) + ' drawn ÷ ' + totalHours + ' owner hours this week' + (entries.length > 1 ? ', split by each owner’s share of hours:' : '.')));
        if (entries.length > 1) {
          entries.forEach(function (e) {
            var row = el('div', 'oi-share-row');
            row.appendChild(el('span', null, esc(e.ownerName) + ' · ' + e.ownerHours + ' hrs'));
            row.appendChild(el('span', null, esc(fmtMoney(rate * (e.ownerHours || 0)))));
            wageCard.appendChild(row);
          });
        }
      } else {
        wageCard.appendChild(el('div', 'set-note', 'No owner hours logged for this week yet, so a rate can’t be worked out. ' + esc(fmtMoney(oi.wages.actual)) + ' was drawn from Xero this week.'));
      }
      root.appendChild(wageCard);
    }
  }
}

/* ============================================================
   Budget tab (banksia-dashboard-spec.md #3.3). Read-only, whole-of-business,
   month-by-month view of Xero's Budget Manager for a calendar year (Jan-Dec
   - the business's own July-June financial year doesn't apply here, the
   spec is explicit this mirrors the old spreadsheet's Jan-Dec layout).
   Targets only - no actual-vs-budget here, that's the P&L tab. /api/budget
   supplies raw monthly $ figures only; "weeks in month" and the
   transactions/avg-spend target rows (not something Xero has) are computed
   here from the same SETTINGS.transactionsTargetWeekly/avgSpendTarget the
   P&L tab already uses.
============================================================ */
function fmtMoneyOrDash(v) { return v == null ? '—' : fmtMoney(v); }

/* "Weeks in month" comes from SETTINGS.weeksInMonth (owner-typed, see its
   default comment) - a real fixed trading-calendar pattern, not something
   computable from actual dates. Falls back to a plain 4-4-5 pattern if
   somehow unset. */
function weeksInMonthSetting(i) {
  var arr = Array.isArray(SETTINGS.weeksInMonth) ? SETTINGS.weeksInMonth : [4, 4, 5, 4, 4, 5, 4, 4, 5, 4, 4, 5];
  return (typeof arr[i] === 'number' && arr[i] > 0) ? arr[i] : 0;
}
function pctOfRevenue(v, revenue) {
  return (v == null || !revenue) ? null : (v / revenue) * 100;
}

/* Manual trigger only, same "nothing pulls live except on demand" rule as
   every other Xero-backed tab. Account classification is independent of
   any date range now (Chart-of-Accounts based, see worker.js), so unlike
   the first version this needs no "this month" period just to classify
   accounts. */
function fetchBudget() {
  var b = state.budget;
  if (b.loading) return;
  if (isManual()) { b.data = { available: false, reason: 'manual_mode' }; render(); return; }
  b.loading = true; b.error = null;
  render();
  fetch('/api/budget?year=' + b.year).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function (json) {
    b.data = json; b.loading = false; render();
  }).catch(function () {
    b.loading = false; b.error = 'Could not reach the dashboard just now. Try again.'; render();
  });
}

function renderBudget(root) {
  root.appendChild(el('div', 'screen-title', 'Budget'));
  root.appendChild(el('p', 'screen-sub', 'A read-only view of your Xero Budget Manager, month by month across the year. To change a target, change it in Xero — actual-vs-budget comparisons live on the P&amp;L tab.'));

  var b = state.budget;
  var yearBar = el('div', 'period-bar');
  yearBar.appendChild(el('span', 'period-label', 'Year'));
  var prevBtn = el('button', 'pchip', '← ' + (b.year - 1));
  prevBtn.onclick = function () { b.year -= 1; b.data = null; render(); };
  yearBar.appendChild(prevBtn);
  yearBar.appendChild(el('span', 'pchip on', String(b.year)));
  var nextBtn = el('button', 'pchip', (b.year + 1) + ' →');
  nextBtn.onclick = function () { b.year += 1; b.data = null; render(); };
  yearBar.appendChild(nextBtn);
  root.appendChild(yearBar);

  if (isManual()) {
    root.appendChild(el('div', 'banner banner-amber', 'You’re in ‘I type them in’ mode, so there’s no Xero connection to pull the budget from.'));
    return;
  }

  var loadBtn = el('button', 'btn-primary-dash', b.loading ? 'Fetching…' : 'Load budget');
  loadBtn.style.margin = '0.6rem 0 1.1rem';
  loadBtn.disabled = b.loading;
  loadBtn.onclick = function () { fetchBudget(); };
  root.appendChild(loadBtn);

  if (b.error) root.appendChild(el('div', 'banner banner-coral', esc(b.error)));

  var d = b.data;
  if (!d) {
    root.appendChild(el('div', 'pl-empty', 'Click Load budget to pull ' + esc(P.accounting) + '’s Budget Manager for ' + b.year + '.'));
    return;
  }
  if (d.available === false) {
    var msg = d.reason === 'not_connected' ? ('Connect ' + esc(P.accounting) + ' on the Connections screen first.') : 'Not available right now.';
    root.appendChild(el('div', 'banner banner-amber', msg));
    return;
  }
  Object.keys(d.errors || {}).forEach(function (k) { if (d.errors[k]) root.appendChild(el('div', 'banner banner-coral', esc(d.errors[k]))); });
  if (!d.budgetAvailable || d.debug) {
    var abanner = el('div', 'banner banner-amber');
    abanner.innerHTML = d.budgetAvailable
      ? 'Some months are missing budget data — see the raw detail below. Tell your AI.'
      : 'Budget figures didn’t line up against your chart of accounts this time — the table below is empty. Tell your AI so it can check the account matching.';
    if (d.debug) {
      var dbg = document.createElement('pre');
      dbg.style.cssText = 'white-space:pre-wrap;font-size:11px;margin-top:8px;font-family:monospace;';
      dbg.textContent = JSON.stringify(d.debug, null, 2);
      abanner.appendChild(dbg);
    }
    root.appendChild(abanner);
  }

  var months = d.months || [];
  var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  var wrap = el('div', 'budget-table-wrap');
  var table = el('div', 'budget-table');

  table.appendChild(el('div', 'budget-cell head rowlabel', ''));
  monthNames.forEach(function (n) { table.appendChild(el('div', 'budget-cell head', n)); });

  function metricRow(label, fmtFn, cls) {
    table.appendChild(el('div', 'budget-cell rowlabel' + (cls ? ' ' + cls : ''), esc(label)));
    months.forEach(function (m, i) { table.appendChild(el('div', 'budget-cell val' + (cls ? ' ' + cls : ''), esc(fmtFn(m, i)))); });
  }
  function pctRow(label, valueFn) {
    metricRow(label, function (m, i) { return fmtPctVal(pctOfRevenue(valueFn(m), m.revenue)); }, 'sub');
  }

  metricRow('Weeks in month', function (m, i) { return String(weeksInMonthSetting(i)); });
  metricRow('Transactions target', function (m, i) {
    return SETTINGS.transactionsTargetWeekly ? fmtInt(SETTINGS.transactionsTargetWeekly * weeksInMonthSetting(i)) : '—';
  });
  metricRow('Avg spend target', function () { return SETTINGS.avgSpendTarget ? fmtMoney(SETTINGS.avgSpendTarget) : '—'; });
  metricRow('Revenue', function (m) { return fmtMoneyOrDash(m.revenue); });
  metricRow('COGS', function (m) { return fmtMoneyOrDash(m.cogs); });
  pctRow('COGS %', function (m) { return m.cogs; });
  metricRow('Wages', function (m) { return fmtMoneyOrDash(m.wages); });
  pctRow('Wages %', function (m) { return m.wages; });
  metricRow('Gross profit', function (m) {
    return (m.revenue == null) ? '—' : fmtMoney(m.revenue - (m.cogs || 0) - (m.wages || 0));
  }, 'sub');

  metricRow('Opex', function (m) { return fmtMoneyOrDash(m.opex); });
  pctRow('Opex %', function (m) { return m.opex; });

  metricRow('Net profit', function (m) { return fmtMoneyOrDash(m.netProfit); }, 'total');
  metricRow('Owners pay', function (m) { return fmtMoneyOrDash(m.ownerPay); });
  pctRow('Owner %', function (m) { return m.ownerPay; });
  metricRow('Actual profit', function (m) { return fmtMoneyOrDash(m.actualProfit); }, 'total');
  pctRow('Profit %', function (m) { return m.actualProfit; });

  wrap.appendChild(table);
  root.appendChild(wrap);

  /* Opex line items - every budgeted account by name, one column set per
     month, same "show the detail" idea as the P&L tab's Opex dropdown but
     laid out as its own table since there's a month column per line item. */
  var opexNames = {};
  months.forEach(function (m) { (m.opexLines || []).forEach(function (l) { opexNames[l.label] = true; }); });
  opexNames = Object.keys(opexNames).sort();
  if (opexNames.length) {
    var toggle = el('button', 'pl-toggle', state.budget.openOpexLines ? 'Hide opex line items' : ('Show ' + opexNames.length + ' opex line items'));
    toggle.style.margin = '0.6rem 0';
    toggle.onclick = function () { state.budget.openOpexLines = !state.budget.openOpexLines; render(); };
    root.appendChild(toggle);
    if (state.budget.openOpexLines) {
      var lwrap = el('div', 'budget-table-wrap');
      var ltable = el('div', 'budget-table');
      ltable.appendChild(el('div', 'budget-cell head rowlabel', ''));
      monthNames.forEach(function (n) { ltable.appendChild(el('div', 'budget-cell head', n)); });
      opexNames.forEach(function (name) {
        ltable.appendChild(el('div', 'budget-cell rowlabel', esc(name)));
        months.forEach(function (m) {
          var line = (m.opexLines || []).filter(function (l) { return l.label === name; })[0];
          ltable.appendChild(el('div', 'budget-cell val', esc(line ? fmtMoney(line.value) : '—')));
        });
      });
      lwrap.appendChild(ltable);
      root.appendChild(lwrap);
    }
  }

  root.appendChild(el('p', 'set-note', 'Transactions target, average spend target and weeks in month are set in Settings.'));
}

function renderSettings(root) {
  root.appendChild(el('div', 'screen-title', 'Settings'));
  root.appendChild(el('p', 'screen-sub', 'The bits you might want to change, with no code anywhere. Your AI set the rest up during the build.'));

  root.appendChild(el('div', 'set-label', 'Where your numbers come from'));
  var modeWrap = el('div', 'mode-wrap');
  [ { k: 'manual', t: 'I type them in', d: 'Enter the numbers from your profit and loss and POS report each week. Works straight away, with nothing to connect.' },
    { k: 'live', t: 'Connect my software', d: 'Your AI links your accounting and POS so the numbers update on their own. More to set up.' }
  ].forEach(function (m) {
    var mc = el('div', 'mode-card' + (SETTINGS.dataMode === m.k ? ' on' : ''));
    mc.appendChild(el('div', 'mode-t', m.t));
    mc.appendChild(el('div', 'mode-d', m.d));
    mc.onclick = function () { SETTINGS.dataMode = m.k; saveSettings(); state.view = (m.k === 'manual' ? 'enter' : 'dashboard'); fetchData(); };
    modeWrap.appendChild(mc);
  });
  root.appendChild(modeWrap);

  var grid = el('div', 'set-grid');

  var c1 = el('div', 'set-cell');
  c1.appendChild(el('div', 'set-label', 'Venue name'));
  var vn = document.createElement('input'); vn.type = 'text'; vn.value = SETTINGS.venueName; vn.maxLength = 60;
  vn.onchange = function () { SETTINGS.venueName = vn.value || 'Your venue'; saveSettings(); render(); };
  c1.appendChild(vn);
  grid.appendChild(c1);

  var c2 = el('div', 'set-cell');
  c2.appendChild(el('div', 'set-label', 'Default period'));
  var sel = document.createElement('select');
  PERIODS.forEach(function (p) {
    if (p.key === 'custom') return;
    var o = document.createElement('option'); o.value = p.key; o.textContent = p.label;
    if (SETTINGS.defaultPeriod === p.key) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = function () { SETTINGS.defaultPeriod = sel.value; saveSettings(); };
  c2.appendChild(sel);
  c2.appendChild(el('div', 'set-note', 'What the dashboard opens on.'));
  grid.appendChild(c2);

  var c3 = el('div', 'set-cell');
  c3.appendChild(el('div', 'set-label', 'Week starts on'));
  var ws = document.createElement('select');
  var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  days.forEach(function (d, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = d;
    if (+SETTINGS.weekStart === i) o.selected = true;
    ws.appendChild(o);
  });
  ws.onchange = function () { SETTINGS.weekStart = +ws.value; saveSettings(); fetchData(); };
  c3.appendChild(ws);
  grid.appendChild(c3);

  var c4 = el('div', 'set-cell');
  c4.appendChild(el('div', 'set-label', 'Trading day rolls over at'));
  var ro = document.createElement('select');
  for (var h = 0; h <= 6; h++) {
    var o2 = document.createElement('option'); o2.value = h;
    o2.textContent = (h === 0) ? 'Midnight (no rollover)' : (h + 'am');
    if (+SETTINGS.rolloverHour === h) o2.selected = true;
    ro.appendChild(o2);
  }
  ro.onchange = function () { SETTINGS.rolloverHour = +ro.value; saveSettings(); fetchData(); };
  c4.appendChild(ro);
  c4.appendChild(el('div', 'set-note', 'If you trade past midnight, sales before this hour count to the previous day.'));
  grid.appendChild(c4);

  var c5 = el('div', 'set-cell');
  c5.appendChild(el('div', 'set-label', 'Timezone'));
  var tzSel = document.createElement('select');
  (TZ_CHOICES[KIT_CONFIG.region] || [SETTINGS.timezone]).forEach(function (z) {
    var o = document.createElement('option'); o.value = z; o.textContent = z.split('/')[1].replace('_', ' ');
    if (SETTINGS.timezone === z) o.selected = true;
    tzSel.appendChild(o);
  });
  tzSel.onchange = function () { SETTINGS.timezone = tzSel.value; saveSettings(); fetchData(); };
  c5.appendChild(tzSel);
  grid.appendChild(c5);

  var c6 = el('div', 'set-cell');
  c6.appendChild(el('div', 'set-label', 'Accent colour'));
  var sw = el('div', 'swatches');
  ACCENTS.forEach(function (a) {
    var s = el('div', 'swatch' + (SETTINGS.accent === a.key ? ' on' : ''));
    s.style.background = a.c;
    s.title = a.key;
    s.onclick = function () { SETTINGS.accent = a.key; saveSettings(); render(); };
    sw.appendChild(s);
  });
  c6.appendChild(sw);
  grid.appendChild(c6);

  root.appendChild(grid);

  /* Targets and alerts (Monday-review thresholds) */
  root.appendChild(el('div', 'screen-title', 'Targets and alerts'));
  root.appendChild(el('p', 'screen-sub', 'Set the level you want each number to stay on the right side of. Cost and profit targets are a share of revenue (30 means 30% of revenue); transaction and spend targets are a plain number. A card flags amber when it slips to the wrong side. Revenue is shown against its own recent average instead of a fixed target.'));
  var tgrid = el('div', 'set-grid');
  CHOSEN.forEach(function (k) {
    var mdef = METRIC_DEFS[k];
    if (mdef.benchmark) return;
    if (k === 'acs') {
      /* Average customer spend gets its own red/amber/green pair instead of a
         single target: acsLow is the red line, acs (reused) is the green line. */
      var cellLow = el('div', 'set-cell');
      cellLow.appendChild(el('div', 'set-label', 'Average customer spend · red below'));
      var inpLow = document.createElement('input'); inpLow.type = 'number'; inpLow.step = 'any';
      inpLow.value = (SETTINGS.targets && typeof SETTINGS.targets.acsLow === 'number') ? SETTINGS.targets.acsLow : '';
      inpLow.placeholder = 'e.g. 30';
      inpLow.onchange = function () {
        if (!SETTINGS.targets) SETTINGS.targets = {};
        var val = parseFloat(inpLow.value);
        if (isFinite(val)) SETTINGS.targets.acsLow = val; else delete SETTINGS.targets.acsLow;
        saveSettings(); render();
      };
      cellLow.appendChild(inpLow);
      cellLow.appendChild(el('div', 'set-note', 'Below this ' + KIT_CONFIG.currency + ' amount, the trend bar shows red.'));
      tgrid.appendChild(cellLow);

      var cellHigh = el('div', 'set-cell');
      cellHigh.appendChild(el('div', 'set-label', 'Average customer spend · green at/above'));
      var inpHigh = document.createElement('input'); inpHigh.type = 'number'; inpHigh.step = 'any';
      inpHigh.value = (SETTINGS.targets && typeof SETTINGS.targets.acs === 'number') ? SETTINGS.targets.acs : '';
      inpHigh.placeholder = 'e.g. 31.5';
      inpHigh.onchange = function () {
        if (!SETTINGS.targets) SETTINGS.targets = {};
        var val = parseFloat(inpHigh.value);
        if (isFinite(val)) SETTINGS.targets.acs = val; else delete SETTINGS.targets.acs;
        saveSettings(); render();
      };
      cellHigh.appendChild(inpHigh);
      cellHigh.appendChild(el('div', 'set-note', 'Between the two, the bar shows amber. At or above this, green.'));
      tgrid.appendChild(cellHigh);
      return;
    }
    var cell = el('div', 'set-cell');
    cell.appendChild(el('div', 'set-label', esc(mdef.label) + (mdef.dual ? ' (% of revenue)' : '')));
    var inp = document.createElement('input'); inp.type = 'number'; inp.step = 'any';
    inp.value = (SETTINGS.targets && typeof SETTINGS.targets[k] === 'number') ? SETTINGS.targets[k] : '';
    inp.placeholder = (mdef.goodDir === 'down' ? 'alert if above' : 'alert if below');
    inp.onchange = function () {
      if (!SETTINGS.targets) SETTINGS.targets = {};
      var val = parseFloat(inp.value);
      if (isFinite(val)) SETTINGS.targets[k] = val; else delete SETTINGS.targets[k];
      saveSettings(); render();
    };
    cell.appendChild(inp);
    var unit = mdef.dual ? 'percent of revenue' : (mdef.fmt === 'int' ? 'count' : KIT_CONFIG.currency);
    cell.appendChild(el('div', 'set-note', (mdef.goodDir === 'down' ? 'Alerts when above this ' : 'Alerts when below this ') + unit + '.'));
    tgrid.appendChild(cell);
  });
  root.appendChild(tgrid);

  /* Cash Split policy numbers - not something Xero reports, the owner sets these */
  root.appendChild(el('div', 'screen-title', 'Cash split'));
  root.appendChild(el('p', 'screen-sub', 'The two numbers on the Cash split tab that are policy, not accounting - Xero can’t supply either of these.'));
  var csgrid = el('div', 'set-grid');

  var csc1 = el('div', 'set-cell');
  csc1.appendChild(el('div', 'set-label', 'Card surcharge %'));
  var csi1 = document.createElement('input'); csi1.type = 'number'; csi1.step = 'any'; csi1.min = '0';
  csi1.value = (typeof SETTINGS.surchargePct === 'number') ? SETTINGS.surchargePct : '';
  csi1.onchange = function () {
    var val = parseFloat(csi1.value);
    SETTINGS.surchargePct = isFinite(val) ? val : 0;
    saveSettings(); render();
  };
  csc1.appendChild(csi1);
  csc1.appendChild(el('div', 'set-note', 'Taken off the top of the week’s deposit first, before GST or COGS.'));
  csgrid.appendChild(csc1);

  var csc2 = el('div', 'set-cell');
  csc2.appendChild(el('div', 'set-label', 'Tax reserve %'));
  var csi2 = document.createElement('input'); csi2.type = 'number'; csi2.step = 'any'; csi2.min = '0';
  csi2.value = (typeof SETTINGS.taxPct === 'number') ? SETTINGS.taxPct : '';
  csi2.onchange = function () {
    var val = parseFloat(csi2.value);
    SETTINGS.taxPct = isFinite(val) ? val : 0;
    saveSettings(); render();
  };
  csc2.appendChild(csi2);
  csc2.appendChild(el('div', 'set-note', 'Share of Net Revenue set aside for tax, on top of the Cash/Profit account.'));
  csgrid.appendChild(csc2);

  root.appendChild(csgrid);

  /* P&L tab settings - tolerance rule is deferred per the spec (exact
     per-line rules TBD), and the transactions/spend targets aren't in Xero
     (Budget Manager holds $ only) and the History tab that would otherwise
     import them from the old sheet isn't built yet - all three live here
     until there's a better home for them. */
  root.appendChild(el('div', 'screen-title', 'P&L'));
  root.appendChild(el('p', 'screen-sub', 'How close to budget counts as on track, and the two targets Xero can’t supply.'));
  var plgrid = el('div', 'set-grid');

  var plc1 = el('div', 'set-cell');
  plc1.appendChild(el('div', 'set-label', 'On-track tolerance %'));
  var pli1 = document.createElement('input'); pli1.type = 'number'; pli1.step = 'any'; pli1.min = '0';
  pli1.value = (typeof SETTINGS.plTolerancePct === 'number') ? SETTINGS.plTolerancePct : '';
  pli1.onchange = function () {
    var val = parseFloat(pli1.value);
    SETTINGS.plTolerancePct = isFinite(val) ? val : 0;
    saveSettings(); render();
  };
  plc1.appendChild(pli1);
  plc1.appendChild(el('div', 'set-note', 'Within this % of budget shows green; further off (the wrong way) shows amber, then red past double.'));
  plgrid.appendChild(plc1);

  var plc2 = el('div', 'set-cell');
  plc2.appendChild(el('div', 'set-label', 'Transactions target · per week'));
  var pli2 = document.createElement('input'); pli2.type = 'number'; pli2.step = 'any'; pli2.min = '0';
  pli2.value = (typeof SETTINGS.transactionsTargetWeekly === 'number' && SETTINGS.transactionsTargetWeekly) ? SETTINGS.transactionsTargetWeekly : '';
  pli2.placeholder = 'e.g. 900';
  pli2.onchange = function () {
    var val = parseFloat(pli2.value);
    SETTINGS.transactionsTargetWeekly = isFinite(val) ? val : 0;
    saveSettings(); render();
  };
  plc2.appendChild(pli2);
  plc2.appendChild(el('div', 'set-note', 'Scaled to the P&L tab’s selected period for the catch-up panel.'));
  plgrid.appendChild(plc2);

  var plc3 = el('div', 'set-cell');
  plc3.appendChild(el('div', 'set-label', 'Average spend target'));
  var pli3 = document.createElement('input'); pli3.type = 'number'; pli3.step = 'any'; pli3.min = '0';
  pli3.value = (typeof SETTINGS.avgSpendTarget === 'number' && SETTINGS.avgSpendTarget) ? SETTINGS.avgSpendTarget : '';
  pli3.placeholder = 'e.g. 31.50';
  pli3.onchange = function () {
    var val = parseFloat(pli3.value);
    SETTINGS.avgSpendTarget = isFinite(val) ? val : 0;
    saveSettings(); render();
  };
  plc3.appendChild(pli3);
  plc3.appendChild(el('div', 'set-note', 'Used to turn a revenue shortfall into a transaction-count catch-up figure.'));
  plgrid.appendChild(plc3);

  root.appendChild(plgrid);

  /* Budget tab: the "weeks in month" trading calendar - a fixed pattern
     the owner maintains by hand, not derivable from actual dates (see
     defaultSettings' comment). Transactions/avg-spend targets above are
     shared with the Budget tab too, not repeated here. */
  root.appendChild(el('div', 'screen-title', 'Budget'));
  root.appendChild(el('p', 'screen-sub', 'Weeks in each month, for the Budget tab’s targets - your own trading calendar, not a plain calendar count.'));
  var wimGrid = el('div', 'set-grid');
  ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'].forEach(function (name, i) {
    var cell = el('div', 'set-cell');
    cell.appendChild(el('div', 'set-label', name));
    var inp = document.createElement('input'); inp.type = 'number'; inp.step = '1'; inp.min = '0';
    var arr = Array.isArray(SETTINGS.weeksInMonth) ? SETTINGS.weeksInMonth : [];
    inp.value = (typeof arr[i] === 'number') ? arr[i] : '';
    inp.onchange = function () {
      if (!Array.isArray(SETTINGS.weeksInMonth)) SETTINGS.weeksInMonth = [4, 4, 5, 4, 4, 5, 4, 4, 5, 4, 4, 5];
      var val = parseFloat(inp.value);
      SETTINGS.weeksInMonth[i] = isFinite(val) ? val : 0;
      saveSettings(); render();
    };
    cell.appendChild(inp);
    wimGrid.appendChild(cell);
  });
  root.appendChild(wimGrid);

  if (!isManual()) {
    root.appendChild(el('div', 'section-sub', 'Session'));
    var logoutBtn = el('button', 'btn-plain', 'Log out');
    logoutBtn.onclick = function () { fetch('/api/logout', { method: 'POST' }).then(function () { location.reload(); }); };
    root.appendChild(logoutBtn);
  }
}

/* ============================================================
   Boot
============================================================ */
state.period = SETTINGS.defaultPeriod || 'thisWeek';
render();
fetchData();
</script>
</body>
</html>
